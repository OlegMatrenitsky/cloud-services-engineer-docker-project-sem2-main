services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8081"

    read_only: true

    cap_drop:
      - ALL

    cpus: "0.50"
    mem_limit: 512m

    restart: on-failure

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: /api

    expose:
      - "8080"

    read_only: true

    cap_drop:
      - ALL

    cpus: "0.50"
    mem_limit: 512m

    restart: on-failure

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    read_only: true

    cap_drop:
      - ALL

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    cpus: "0.25"
    mem_limit: 256m

    restart: on-failure

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
    internal: true

  backend_net:
    driver: bridge
    internal: true
