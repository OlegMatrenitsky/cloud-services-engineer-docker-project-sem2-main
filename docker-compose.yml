services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend

    expose:
      - "8081"

    read_only: true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

    restart: on-failure

    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VUE_APP_API_URL: /api

    container_name: frontend

    expose:
      - "8080"

    read_only: true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

    restart: on-failure

    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    read_only: true

    cap_drop:
      - ALL

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

    restart: on-failure

    depends_on:
      - frontend
      - backend

    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
    internal: true

  backend_net:
    driver: bridge
    internal: true
