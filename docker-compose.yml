services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8081"

    read_only: true

    cap_drop:
      - ALL

    cpus: "0.50"
    mem_limit: 512m

    restart: on-failure

    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8081 || exit 1" ]
      interval: 10s
      retries: 5

    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: /api

    expose:
      - "8080"

    read_only: true

    cap_drop:
      - ALL

    cpus: "0.50"
    mem_limit: 512m

    restart: on-failure

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/momo-store/ || exit 1" ]
      interval: 30s
      retries: 3
    profiles: [ "development", "production" ]

    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    read_only: true

    cap_drop:
      - ALL

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    cpus: "0.25"
    mem_limit: 256m

    restart: on-failure

    profiles: [ "production" ]

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
    internal: true

  backend_net:
    driver: bridge
    internal: true
