services:
  nginx:
    image: nginx:alpine
    container_name: docker-project-nginx
    restart: unless-stopped
    profiles:
      - production
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  frontend:
    image: ${DOCKER_USER}/docker-project-frontend:latest
    container_name: docker-project-frontend
    restart: unless-stopped
    profiles:
      - production
    expose:
      - "8080"
    networks:
      - app-network

  backend:
    image: ${DOCKER_USER}/docker-project-backend:latest
    container_name: docker-project-backend
    restart: unless-stopped
    profiles:
      - production
    expose:
      - "8081"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
