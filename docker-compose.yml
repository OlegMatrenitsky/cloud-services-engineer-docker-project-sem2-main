services:
  backend:
    build:
      context: ./backend
    image: ${DOCKER_USER}/docker-project-backend:latest

    networks:
      - back_net

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8081 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    profiles:
      - development
      - production

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: "/api"

    image: ${DOCKER_USER}/docker-project-frontend:latest

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - front_net

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost/momo-store/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    profiles:
      - development
      - production

  nginx:
    image: nginx:1.27-alpine

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    networks:
      - front_net
      - back_net

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy-cache:/var/cache/nginx:rw
      - proxy-run:/var/run:rw

    restart: unless-stopped

    profiles:
      - production

networks:
  front_net:
    driver: bridge

  back_net:
    driver: bridge

volumes:
  proxy-cache:
  proxy-run:
