services:
  backend:
    build:
      context: ./backend
    image: ${DOCKER_USER}/docker-project-backend:latest

    networks:
      - back_net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure

    read_only: true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: "/api"

    image: ${DOCKER_USER}/docker-project-frontend:latest

    networks:
      - front_net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure

    read_only: true

    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  nginx:
    image: nginx:1.27-alpine

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    networks:
      - front_net
      - back_net

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy-cache:/var/cache/nginx
      - proxy-run:/var/run

    restart: unless-stopped

    cap_drop:
      - ALL


networks:
  front_net:
    driver: bridge

  back_net:
    driver: bridge


volumes:
  proxy-cache:
  proxy-run: