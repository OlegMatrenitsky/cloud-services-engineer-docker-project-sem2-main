services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped

    expose:
      - "8081"

    networks:
      - backend_net

    healthcheck:
      test: [ "CMD", "/bin/sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/health || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: /api
    container_name: frontend
    restart: unless-stopped

    expose:
      - "8080"

    networks:
      - frontend_net

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
    internal: true

  backend_net:
    driver: bridge
    internal: true
